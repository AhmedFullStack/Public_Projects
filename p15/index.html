<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوكس كاندل</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="cur-dot" id="dot"></div>
  <div class="cur-ring" id="ring"></div>

  <!-- HERO -->
  <div class=" hero-card">
    <img src="assets/images/image.png" alt="شمعة أنيقة" />
    <p class="hero-text">اناقة تضئ منزلك</p>
    <button class="hero-btn">اطلب الآن</button>
  </div>

  <!-- CARD 1 -->
  <div class="card prod-card">
    <img src="assets/images/image 2.png" alt="مجموعة شموع" />
    <div class="prod-body">
      <p class="prod-title">مجموعتنا المميزة أو عالم من الروائح الساحرة</p>
      <div class="prod-btns">
        <span class="prod-btn">الروائح</span>
        <span class="prod-btn">الجودة</span>
        <span class="prod-btn">الخامات الطبيعية</span>
      </div>
      <button class="prod-btn">اكتشف العطور</button>
    </div>
  </div>

  <!-- CARD 2 -->
  <div class="card prod-card">
    <img src="assets/images/image 3.png" alt="ديفيوزر وشموع" />
    <div class="prod-body">
      <p class="prod-title">اضف لمسة دائمة لمنزلك</p>
      <div class="prod-btns">
        <span class="prod-btn">الروائح</span>
        <span class="prod-btn">الجودة</span>
        <span class="prod-btn">الخامات الطبيعية</span>
      </div>
      <button class="prod-btn">اكتشف العطور</button>
    </div>
  </div>

  <!-- CARD 3 -->
  <div class="card prod-card">
    <img src="assets/images/image 4.png" alt="شموع ملونة" />
    <div class="prod-body">
      <p class="prod-title">ألوان تبهج الروح وعطر يريح النفس</p>
      <div class="prod-btns">
        <span class="prod-btn">الروائح</span>
        <span class="prod-btn">الجودة</span>
        <span class="prod-btn">الخامات الطبيعية</span>
      </div>
      <button class="prod-btn">اكتشف العطور</button>
    </div>
  </div>

<script src="assets/js/script.js"></script>
</body>
</html>
