<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-item active"><i class="fa-solid fa-house"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-bag-shopping"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-certificate"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-star"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-heart"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-truck"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-cart-shopping"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-bell"></i></div>
        <div class="sidebar-item"><i class="fa-solid fa-money-bill"></i></div>
        <div class="sidebar-item" style="margin-top: auto;"><i class="fa-solid fa-gear"></i></div>
    </aside>

    <main class="main-content">
        
        <header>
            <div class="welcome-text">
                <h1>Welcome back!</h1>
                <p>Quick overview & tips for you!</p>
            </div>
            <div class="header-buttons">
                <button class="btn-new-order"><i class="fa-solid fa-truck-fast"></i> New Order</button>
                <button class="btn-browse"><i class="fa-solid fa-shirt"></i> Browse Products</button>
            </div>
        </header>

        <section class="stats-container">
            <div class="stat-card card-green">
                <div>
                    <h3>All Profit</h3>
                    <div class="value">0EGP</div>
                </div>
                <i class="fa-solid fa-ticket"></i>
            </div>
            
            <div class="stat-card card-orange">
                <div>
                    <h3>Expected Profit</h3>
                    <div class="value">0EGP</div>
                </div>
                <i class="fa-solid fa-dollar-sign"></i>
            </div>

            <div class="stat-card card-purple">
                <div>
                    <h3>Expected Orders</h3>
                    <div class="value">0</div>
                </div>
                <i class="fa-solid fa-truck-clock"></i>
            </div>

            <div class="stat-card card-blue">
                <div>
                    <h3>Orders</h3>
                    <div class="value">0</div>
                </div>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
        </section>

        <div class="content-grid">
            
            <section class="products-section">
                <div class="section-header">
                    <h2>Best Selling products</h2>
                    <span>Last 30 days</span>
                </div>

                <div class="products-grid">
                    <div class="product-card">
                        <img src="https://placehold.co/200x200/111/FFF?text=Hoodie+1" alt="Product">
                    </div>
                    <div class="product-card">
                        <img src="https://placehold.co/200x200/111/FFF?text=Hoodie+2" alt="Product">
                    </div>
                    <div class="product-card">
                        <img src="https://placehold.co/200x200/111/FFF?text=Hoodie+3" alt="Product">
                    </div>
                    <div class="product-card">
                        <img src="https://placehold.co/200x200/111/FFF?text=Hoodie+4" alt="Product">
                    </div>
                </div>
            </section>

            <aside class="right-widgets">
                <div class="widget-card">
                    <h4 style="text-align: right; margin-bottom: 5px;">شرح فيديو</h4>
                    <div class="video-thumbnail">
                        <div style="position: absolute; bottom: 10px; right: 10px; color: white; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 4px; font-size: 12px;">3000 جنيه</div>
                    </div>
                    <button class="btn-outline">
                        فيديو على الطبيعة <i class="fa-solid fa-video"></i>
                    </button>
                </div>

                <button class="btn-outline" style="justify-content: space-between;">
                   <span>Material images 2024</span> <i class="fa-solid fa-shirt" style="color: orange;"></i>
                </button>
                
                 <button class="btn-outline" style="justify-content: space-between;">
                   <span>Material images</span> <i class="fa-solid fa-shirt" style="color: orange;"></i>
                </button>
            </aside>
        </div>
    </main>

    <div class="whatsapp-float">
        <i class="fa-brands fa-whatsapp"></i>
    </div>
<script src="script.js"></script>
</body>
</html>
